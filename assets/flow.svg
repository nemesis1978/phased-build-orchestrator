<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Phased build pipeline: project state, then phases with a gate and four outcome states">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker>
    <marker id="arrowNo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F87171"/></marker>
    <marker id="arrowYes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#0B1220"/>
<text x="64" y="48" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">One state check, then one phase at a time</text>
<text x="64" y="74" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Phase 0 reads the directory. After that no phase advances because the agent says it is done — only because the gate passed.</text>
  <!-- pipeline -->
  <g><rect x="64" y="100" width="380" height="50" rx="8" fill="#16233D" stroke="#2A3B5E"/>
<text x="84" y="122" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#64748B">INPUT</text>
<text x="84" y="140" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#E2E8F0">Idea, informal request</text>
  </g>
  <g><rect x="64" y="172" width="380" height="70" rx="8" fill="#16233D" stroke="#2A3B5E"/>
    <rect x="64" y="172" width="4" height="70" rx="2" fill="#F59E0B"/>
<text x="84" y="190" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#F59E0B">PHASE 0</text>
<text x="84" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#E2E8F0">Read the project state</text>
<text x="84" y="231" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="400" fill="#94A3B8">empty · idea · scaffold · in progress · broken</text>
  </g>
  <g><rect x="64" y="264" width="380" height="52" rx="8" fill="#16233D" stroke="#2A3B5E"/>
<text x="84" y="286" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#38BDF8">PHASE A</text>
<text x="84" y="304" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#E2E8F0">Discovery → project-brief.md</text>
  </g>
  <g><rect x="64" y="336" width="380" height="52" rx="8" fill="#16233D" stroke="#2A3B5E"/>
<text x="84" y="358" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#38BDF8">PHASE C</text>
<text x="84" y="376" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#E2E8F0">Specification → SPEC.md</text>
  </g>
  <g><rect x="64" y="408" width="380" height="52" rx="8" fill="#16233D" stroke="#2A3B5E"/>
<text x="84" y="430" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#38BDF8">PHASE D</text>
<text x="84" y="448" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#E2E8F0">Plan → BUILD_PHASES.md</text>
  </g>
  <g><rect x="64" y="480" width="380" height="52" rx="8" fill="#16233D" stroke="#2A3B5E"/>
<text x="84" y="502" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#38BDF8">PHASE E</text>
<text x="84" y="520" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#E2E8F0">One phase, tests, evidence</text>
  </g>
  <g><rect x="64" y="552" width="380" height="46" rx="8" fill="#16233D" stroke="#2A3B5E"/>
<text x="84" y="574" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#38BDF8">PHASE F / G</text>
<text x="84" y="592" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#E2E8F0">Handoff, regression, closure</text>
  </g>
  <g stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="254" y1="150" x2="254" y2="172"/>
    <line x1="254" y1="242" x2="254" y2="264"/>
    <line x1="254" y1="314" x2="254" y2="336"/>
    <line x1="254" y1="386" x2="254" y2="408"/>
    <line x1="254" y1="458" x2="254" y2="480"/>
    <line x1="254" y1="530" x2="254" y2="552"/>
  </g>
  <!-- gate -->
  <path d="M 640 400 L 730 340 L 820 400 L 730 460 Z" fill="#1B2A44" stroke="#F59E0B" stroke-width="2"/>
<text x="730" y="396" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F59E0B" text-anchor="middle">GATE</text>
<text x="730" y="416" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">all criteria?</text>
  <path d="M 444 505 L 560 505 L 560 400 L 634 400" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 730 460 L 730 520 L 452 520" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#arrowNo)"/>
<text x="742" y="500" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#F87171">NO → fix, retest</text>
  <path d="M 820 400 L 900 400" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrowYes)"/>
<text x="826" y="388" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#34D399">YES</text>
  <!-- outcomes -->
  <rect x="912" y="250" width="224" height="250" rx="12" fill="#111C33" stroke="#26375C"/>
<text x="932" y="278" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="400" fill="#94A3B8">FOUR STATES ONLY</text>
  <circle cx="940" cy="320" r="5" fill="#34D399"/>
<text x="956" y="325" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="400" fill="#E2E8F0">PASS</text>
<text x="956" y="341" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B">criteria + tests ok</text>
  <circle cx="940" cy="368" r="5" fill="#F87171"/>
<text x="956" y="373" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="400" fill="#E2E8F0">FAILED</text>
<text x="956" y="389" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B">tests ran, they failed</text>
  <circle cx="940" cy="416" r="5" fill="#FBBF24"/>
<text x="956" y="421" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="400" fill="#E2E8F0">BLOCKED</text>
<text x="956" y="437" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B">needs a decision</text>
  <circle cx="940" cy="464" r="5" fill="#64748B"/>
<text x="956" y="469" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="400" fill="#E2E8F0">NOT RUN</text>
<text x="956" y="485" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B">never reported as PASS</text>
<text x="64" y="620" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="400" fill="#475569">state · discovery · specification · phasing · gated execution · handoff</text>
</svg>